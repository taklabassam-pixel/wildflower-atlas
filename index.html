<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة ترحيب أطلس العزونية التفاعلي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4efe6;
        }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 20px;
            box-sizing: border-box;
        }

        .welcome-card {
            background-color: #fcfbf7;
            padding: 35px;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            direction: rtl;
            border: 3px solid #8B5A2B;
            box-sizing: border-box;
        }

        .welcome-logo {
            width: 240px;
            height: 240px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .welcome-card h2 {
            color: #2e7d32;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .dynamic-text-container {
            min-height: 160px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .start-interaction-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .start-interaction-btn:hover {
            background-color: #1b5e20;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 6px 30px rgba(46, 125, 50, 0.6); }
            100% { transform: scale(1); box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
        }

        .welcome-card p {
            color: #2c3e50;
            font-size: 1.5rem;
            line-height: 1.9;
            margin: 0;
            white-space: pre-line;
            display: none; 
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            direction: rtl;
            text-align: justify;
        }

        /* كلاس التلاشي والصعود المتناسق */
        .welcome-card p.fade-out-line {
            opacity: 0;
            transform: translateY(-20px);
        }

        .cursor {
            display: none;
            width: 3px;
            background-color: #2e7d32;
            margin-right: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .welcome-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: not-allowed;
            opacity: 0.5;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .welcome-btn.active {
            background-color: #8B5A2B; 
            color: white;
            cursor: pointer;
            opacity: 1;
            box-shadow: 0 5px 15px rgba(139, 90, 43, 0.4);
        }

        .welcome-btn.active:hover {
            background-color: #6f4721;
        }
    </style>
</head>
<body>

    <div id="welcomeModal" class="welcome-overlay">
        <div class="welcome-card">
            <img src="atlas_logo.png" alt="شعار أطلس العزونية" class="welcome-logo">
            
            <h2>أهْلًا بِكَ فِي أَطْلَسِ الْأَشْجَارِ، النَّبَاتَاتِ وَالْأَزْهَارِ الْبَرِّيَّةِ التَّفَاعُلِيِّ</h2>
            
            <div class="dynamic-text-container">
                <button id="startTriggerBtn" class="start-interaction-btn">اضغط هنا لنبدأ العرض ➔</button>
                
                <p id="welcomeText"></p>
                <span id="typingCursor" class="cursor">|</span>
            </div>
            
            <button id="closeWelcomeBtn" class="welcome-btn">تَخَطِّي وَدُخُولُ الْأَطْلَسِ</button>
        </div>
    </div>

   <script>
        document.addEventListener("DOMContentLoaded", () => {
            const welcomeTextElement = document.getElementById("welcomeText");
            const closeWelcomeBtn = document.getElementById("closeWelcomeBtn");
            const typingCursor = document.getElementById("typingCursor");
            const startTriggerBtn = document.getElementById("startTriggerBtn");

            // نصوص العرض باللغة العربية فقط (مع تصحيح "الثروة")
            const welcom_txt_ar_paragraphs = [
                `أَهْلًا بِكَ فِي أَطْلَسِ الْأَشْجَارِ، النَّبَاتَاتِ وَالْأَزْهَارِ الْبَرِّيَّةِ التَّفَاعُلِيِّ؛ دَلِيلِكَ الرَّقْمِيِّ الشَّامِلِ لِاسْتِكْشَافِ الثَّرْوَةِ النَّبَاتِيَّةِ مِنْ حَوْلِكَ.`,
                `هَذَا التَّطْبِيقُ مُصَمَّمٌ خَصِيصًا لِمُسَاعَدَتِكَ فِي التَّعَرُّفِ عَلَى الزُّهُورِ وَالْأَعْشَابِ الْبَرِّيَّةِ، وَمَعْرِفَةِ مَوَاسِمِ إِزْهَارِهَا وَبِيئَاتِهَا الطَّبِيعِيَّةِ عَبْرَ وَاجِهَاتٍ تَفَاعُلِيَّةٍ وَمُرِيحَةٍ.`,
                `يُمْكِنُكَ الْآنَ التَّنَقُّلُ بَيْنَ الْبِطَاقَاتِ الَّتِي تَحْتَوِي عَلَى الْمَعْلُومَاتِ وَالصُّوَرِ الْحَيَّةِ للنباتات، وَالِاسْتِمَاعُ لِنُّطْقِ أَسْمَائِها بِاللُّغَتَيْنِ الْعَرَبِيَّةِ وَاللَّاتِينِيَّةِ.`,
                `نَتَمَنَّى لَكَ رِحْلَةَ اسْتِكْشَافٍ مُمْتِعَةً وَمُثْمِرَةً!`
            ];

            let paragraphIndex = 0;
            let charIndex = 0;
            let currentAudio = null;
            
            // حساب الطول الإجمالي للنصوص لضبط تزامن السرعة
            const totalLength = welcom_txt_ar_paragraphs.reduce((acc, p) => acc + p.length, 0);

            function typeWriter() {
                if (paragraphIndex < welcom_txt_ar_paragraphs.length) {
                    let currentParagraphText = welcom_txt_ar_paragraphs[paragraphIndex];
                    
                    if (charIndex < currentParagraphText.length) {
                        welcomeTextElement.textContent += currentParagraphText.charAt(charIndex);
                        charIndex++;
                        
                        // احتساب السرعة لتتطابق حركة الكتابة تلقائياً مع مدة الـ 30 ثانية للصوت
                        const typingSpeed = (30 * 1000) / totalLength;
                        setTimeout(typeWriter, typingSpeed);
                    } else {
                        // عند اكتمال كتابة السطر الحالي
                        setTimeout(() => {
                            if (paragraphIndex < welcom_txt_ar_paragraphs.length - 1) {
                                // إضافة تأثير التلاشي والصعود للأعلى
                                welcomeTextElement.classList.add('fade-out-line');
                                
                                // الانتظار حتى ينتهي تأثير الـ CSS ثم مسح النص والبدء في السطر التالي
                                setTimeout(() => {
                                    welcomeTextElement.textContent = "";
                                    welcomeTextElement.classList.remove('fade-out-line');
                                    paragraphIndex++;
                                    charIndex = 0;
                                    typeWriter();
                                }, 600);
                            } else {
                                // عند الوصول للسطر الأخير والنهائي
                                typingCursor.style.display = 'none';
                                activateNavigationButton();
                            }
                        }, 2500); // بقاء السطر مقروءاً لمدة ثانيتين ونصف قبل الانتقال
                    }
                }
            }

            function activateNavigationButton() {
                closeWelcomeBtn.classList.add('active');
                closeWelcomeBtn.textContent = "اِبْدَأْ الِاسْتِكْشَافَ ➔";
            }

            function startWelcomePresentation() {
                // إخفاء زر البدء الأولي وتجهيز حقل النصوص
                startTriggerBtn.style.display = "none";
                welcomeTextElement.style.display = "block";
                typingCursor.style.display = "inline-block";
                
                closeWelcomeBtn.classList.add('active');
                closeWelcomeBtn.style.cursor = "pointer";

                localStorage.setItem("atlas_lang", "ar");
                
                // تشغيل الصوت الترحيبي العربي مباشرة
                currentAudio = new Audio('audio/arabic/رسالة ترحيبية.mp3');
                currentAudio.volume = 1.0;
                currentAudio.play().catch(error => console.log("التشغيل الصوتي اختياري:", error));

                // بدء تأثير الكتابة والتلاشي المتتابع
                typeWriter();

                currentAudio.addEventListener('ended', () => {
                    enterTheApp();
                });
            }

            // ربط الحدث بزر البدء العربي الموحد
            startTriggerBtn.addEventListener("click", startWelcomePresentation);

            function enterTheApp() {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                localStorage.setItem("atlas_first_time", "done");
                window.location.href = "atlas.html"; 
            }

            closeWelcomeBtn.addEventListener("click", () => {
                if (closeWelcomeBtn.classList.contains('active')) {
                    enterTheApp();
                }
            });
        });
    </script>
</body>
</html>
