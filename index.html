<!DOCTYPE html>
<html lang="ar" direction="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة ترحيب أطلس العزونية التفاعلي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4efe6;
        }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 20px;
            box-sizing: border-box;
        }

        .welcome-card {
            background-color: #fcfbf7;
            padding: 35px;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            direction: rtl;
            border: 3px solid #8B5A2B;
            box-sizing: border-box;
        }

        .welcome-logo {
            width: 240px;
            height: 240px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .welcome-card h2 {
            color: #2e7d32;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .dynamic-text-container {
            min-height: 160px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تنسيق زر البدء الأولي الكبير لفك حظر الصوت */
        .start-interaction-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.7rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .start-interaction-btn:hover {
            background-color: #1b5e20;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 6px 30px rgba(46, 125, 50, 0.6); }
            100% { transform: scale(1); box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
        }

        .welcome-card p {
            color: #2c3e50;
            font-size: 1.7rem;
            line-height: 1.9;
            text-align: justify;
            margin: 0;
            white-space: pre-line;
            display: none; /* مخفي حتى يضغط المستخدم على زر البدء */
        }

        .cursor {
            display: none;
            width: 3px;
            background-color: #2e7d32;
            margin-right: 3px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* زر "اذهب إلى الأطلس" النهائي */
        .welcome-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: not-allowed;
            opacity: 0.5;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .welcome-btn.active {
            background-color: #8B5A2B; /* يتحول للون الخشبي عند الجاهزية */
            color: white;
            cursor: pointer;
            opacity: 1;
            box-shadow: 0 5px 15px rgba(139, 90, 43, 0.4);
        }

        .welcome-btn.active:hover {
            background-color: #6f4721;
        }
    </style>
</head>
<body>

    <div id="welcomeModal" class="welcome-overlay">
        <div class="welcome-card">
            <img src="atlas_logo.png" alt="شعار أطلس العزونية" class="welcome-logo">
            
            <h2>أهْلًا بِكَ فِي
                أَطْلَسِ الْأَشْجَارِ، النَّبَاتَاتِ وَالْأَزْهَارِ الْبَرِّيَّةِ التَّفَاعُلِيِّ</h2>
            
            <div class="dynamic-text-container">
                <button id="startTriggerBtn" class="start-interaction-btn">اضغط هنا لنبدء</button>
                
                <p id="welcomeText"></p>
                <span id="typingCursor" class="cursor">|</span>
            </div>
            
            <button id="closeWelcomeBtn" class="welcome-btn">تَخَطِّي وَدُخُولُ الْأَطْلَسِ</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const welcomeModal = document.getElementById("welcomeModal");
    const welcomeTextElement = document.getElementById("welcomeText");
    const closeWelcomeBtn = document.getElementById("closeWelcomeBtn");
    const typingCursor = document.getElementById("typingCursor");
    const startTriggerBtn = document.getElementById("startTriggerBtn");

    const fullText = `أَهْلًا بِكَ فِي أَطْلَسِ الْأَشْجَارِ، النَّبَاتَاتِ وَالْأَزْهَارِ الْبَرِّيَّةِ التَّفَاعُلِيِّ؛ دَلِيلِكَ الرَّقْمِيِّ الشَّامِلِ لِاسْتِكْشَافِ الثَّرْوَةِ النَّبَاتِيَّةِ مِنْ حَوْلِكَ.\n\nهَذَا التَّطْبِيقُ مُصَمَّمٌ خَصِيصًا لِمُسَاعَدَتِكَ فِي التَّعَرُّفِ عَلَى الزُّهُورِ وَالْأَعْشَابِ الْبَرِّيَّةِ، وَمَعْرِفَةِ مَوَاسِمِ إِزْهَارِهَا وَبِيئَاتِهَا الطَّبِيعِيَّةِ عَبْرَ وَاجِهَاتٍ تَفَاعُلِيَّةٍ وَمُرِيحَةٍ.\n\nيُمْكِنُكَ الْآنَ التَّنَقُّلُ بَيْنَ الْبِطَاقَاتِ الَّتِي تَحْتَوِي عَلَى الْمَعْلُومَاتِ وَالصُّوَرِ الْحَيَّةِ للنباتات، وَالِاسْتِمَاعُ لِنُّطْقِ أَسْمَائِها بِاللُّغَتَيْنِ الْعَرَبِيَّةِ وَاللَّاتِينِيَّةِ.\n\nنَتَمَنَّى لَكَ رِحْلَةَ اسْتِكْشَافٍ مُمْتِعَةً وَمُثْمِرَةً!`;

    const welcomeAudio = new Audio('audio/arabic/رسالة ترحيبية.mp3');
    welcomeAudio.volume = 1.0;

    let charIndex = 0;
    const typingSpeed = (40 * 1000) / fullText.length; 

    // دالة الطباعة التدريجية
    function typeWriter() {
        if (charIndex < fullText.length) {
            welcomeTextElement.textContent += fullText.charAt(charIndex);
            charIndex++;
            setTimeout(typeWriter, typingSpeed);
        } else {
            typingCursor.style.display = 'none';
            // عند اكتمال كتابة النص تماماً
            activateNavigationButton();
        }
    }

    function activateNavigationButton() {
        closeWelcomeBtn.classList.add('active');
        closeWelcomeBtn.textContent = "اِبْدَأْ الِاسْتِكْشَافَ ➔";
    }

    // 🌟 دالة "أمر الدخول إلى التطبيق" الموحدة
    function enterTheApp() {
        console.log("🚀 جاري تنفيذ أمر الدخول إلى التطبيق الآن...");
        
        // 1. إيقاف الصوت فوراً لمنع التداخل بالخلفية
        welcomeAudio.pause();
        welcomeAudio.currentTime = 0;

        // 2. حفظ الحالة في المتصفح لكي لا تظهر الرسالة مجدداً للمستخدم
        localStorage.setItem("atlas_first_time", "done");

        // 3. إخفاء النافذة الترحيبية بصرياً
        if (welcomeModal) {
            welcomeModal.style.display = "none";
        }

        // 4. [أمر التوجيه الفعلي]: اختر السطر المناسب لهيكلية مشروعك:
        
        // خيار أ: إذا كان التطبيق في صفحة مستقلة باسم index.html أو main.html (احذف تعليق السطر بالأسفل)
         window.location.href = "atlas.html"; 
        
        // خيار ب: إذا كان هذا الملف هو نفسه واجهة الأطلس، فالإخفاء في الأعلى كافٍ لإظهار التطبيق فوراً.
        alert("مرحباً بك في أطلس العزونية! تم الدخول بنجاح."); 
    }

    // عند الضغط على زر البدء الأولي لفك حظر الصوت
    startTriggerBtn.addEventListener("click", () => {
        startTriggerBtn.style.display = "none";
        welcomeTextElement.style.display = "block";
        typingCursor.style.display = "inline-block";
        
        // جعل زر التخطي نشطاً وقابلاً للضغط فوراً
        closeWelcomeBtn.classList.add('active');
        closeWelcomeBtn.style.cursor = "pointer";

        welcomeAudio.play().catch(error => console.log("خطأ صوتي مسموح:", error));
        typeWriter();
    });

    // 🔄 [الحدث الأول]: الدخول التلقائي عند انتهاء قراءة ملف الـ MP3 بالكامل
    welcomeAudio.addEventListener('ended', () => {
        console.log("انتهى الملف الصوتي تلقائياً.");
        enterTheApp(); // الانتقال التلقائي
    });

    // 🎯 [الحدث الثاني]: الدخول عند قيام المستخدم بالضغط على زر التخطي/الاستكشاف بيده
    closeWelcomeBtn.addEventListener("click", () => {
        if (closeWelcomeBtn.classList.contains('active')) {
            console.log("قام المستخدم بالضغط على زر الدخول.");
            enterTheApp(); // الانتقال الفوري
        }
    });
});
    </script>
</body>
</html>
